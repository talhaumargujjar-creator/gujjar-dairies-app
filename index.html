const OPEN={};

const custNames=()=>[...new Set([...SECS.ud[1],...SECS.rc[1],...Object.values(S.days).flatMap(D=>[...(D.ud||[]),...(D.rc||[])].filter(r=>!r.del).map(r=>nkey(r.n)))])].sort();
// Line-wise entry like the khata: draft rows per day and section, saved together with "Save karein".
// The last working day's names come pre-filled with its amount shown faintly; only rows given an amount are saved,
// so a name left empty today does not come back the next day.
const DR={};
const baseN=s=>String(s).trim().replace(/\s*\([\d+.\s]*\)$/,'');
function prevRows(k,d){for(const x of before(d)){const L=live(norm(S.days[x]),k);if(L.length)return L}return []}
const emNames=()=>S.em.filter(e=>!e.off).map(e=>e.name);
function secNames(k){if(k==='ud'||k==='rc')return custNames();const s=new Set([...SECS[k][1],...(k==='sl'?emNames():[])]);for(const D of Object.values(S.days))(D[k]||[]).forEach(e=>{if(!e.del)s.add(baseN(e.n))});return [...s].sort()}
function drafts(k){const key=date+'|'+k;
 if(!DR[key]){const have=new Set(live(day(date),k).map(e=>nkey(baseN(e.n))));DR[key]=prevRows(k,date).filter(e=>!have.has(nkey(baseN(e.n)))).map(e=>({n:baseN(e.n),a:'',ph:n(e.a)}))}
 const R=DR[key];if(!R.length||R[R.length-1].n||R[R.length-1].a)R.push({n:'',a:''});return R}
const drFilled=k=>(DR[date+'|'+k]||[]).filter(r=>r.n.trim()&&String(r.a).trim()).length;
function drRow(k,r,i){return `<div class="addr" style="grid-template-columns:1fr 110px;margin-top:6px"><input type="text" class="dn" id="dn${k}${i}" data-k="${k}" data-i="${i}" value="${esc(r.n)}" placeholder="Naam" list="dl${k}" autocomplete="off" enterkeyhint="next" aria-label="Naam" oninput="drSet('${k}',${i},'n',this.value)"><input type="text" inputmode="decimal" class="da" id="da${k}${i}" data-k="${k}" data-i="${i}" value="${esc(r.a)}" placeholder="${r.ph?'Kal '+f(r.ph):'Raqam'}" enterkeyhint="next" aria-label="Raqam" oninput="drSet('${k}',${i},'a',this.value)"></div>`}
function sec(k){const D=day(date),[title,names0,,hint]=SECS[k],L=live(D,k),tt=L.reduce((a,b)=>a+n(b.a),0),R=drafts(k),sug=R.some(r=>r.ph),fl=drFilled(k);
 const names=k==='sl'&&emNames().length?emNames():names0;
 return `<div class="card"><details ${(OPEN[k]??(L.length>0||sug))?'open':''} ontoggle="OPEN['${k}']=this.open"><summary><span>${title}${L.length?` <span class="muted" style="font-weight:400">(${L.length})</span>`:''}${fl?` <span class="neg" style="font-weight:400">· ${fl} save baqi</span>`:''}</span><b style="margin-left:auto;padding-right:8px">${f(tt)}</b></summary>

 ${L.length?`<div style="margin-top:8px">${L.map(r=>`<div class="row"><span>${esc(r.n)}</span><span>${f(n(r.a))}<button class="x" style="color:var(--bink)" aria-label="${esc(r.n)} badlein" onclick="edE('${k}','${r.id}')">✎</button><button class="x" aria-label="${esc(r.n)} hatayen" onclick="del('${k}','${r.id}')">✕</button></span></div>`).join('')}</div>`:''}
 <datalist id="dl${k}">${secNames(k).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>

 e.preventDefault();const i=+t.dataset.i;if(t.classList.contains('dn')){$('#da'+k+i).focus();return}
 const R=drafts(k);if(i+1>=R.length)R.push({n:'',a:''});const nx=R[i+1];if(!R[i].n&&!R[i].a&&!nx.n)return;
 if(i+1===R.length-1&&!$('#dn'+k+(i+1))){drFocus((nx.n?'da':'dn')+k+(i+1));return}

// "900+900" like the khata adds up; the parts are kept in the name so the khata can be matched later.
function drSave(k){const key=date+'|'+k,R=drafts(k),keep=[],todo=[];
 for(const r of R){const nm=r.n.trim(),raw=String(r.a).replace(/\s/g,'');if(!nm||!raw){keep.push(r);continue}
  const parts=raw.split('+').filter(Boolean),a=parts.reduce((s,x)=>s+n(x),0);
  if(!a||parts.some(x=>isNaN(parseFloat(x)))){alert(`"${nm}" ki raqam sahi likhein.`);return}
  todo.push([k==='ud'||k==='rc'?nkey(nm):nm,a,parts])}
 if(!todo.length){alert('Kisi line mein naam aur raqam dono likhein.');return}
 for(const [nm0,a,parts] of todo){const e={id:nid(),n:parts.length>1?`${nm0} (${parts.join('+')})`:nm0,a,del:false,u:now()};dd(date)[k].push(e);mark('en:'+date+'|'+k+'|'+e.id)}
 DR[key]=keep.filter(r=>r.ph);OPEN[k]=true;const y=scrollY;render();scrollTo(0,y)}

 const nm=prompt('Naam theek karein:',e.n);if(nm===null)return;const raw=prompt('Raqam theek karein (900+900 bhi likh sakte hain):',e.a);if(raw===null)return;
 const parts=String(raw).replace(/\s/g,'').split('+').filter(Boolean),a=parts.reduce((s,x)=>s+n(x),0);
 if(!nm.trim()||!a||parts.some(x=>isNaN(parseFloat(x)))){alert('Naam aur raqam dono sahi likhein.');return}
 e.n=k==='ud'||k==='rc'?nkey(nm):nm.trim();e.a=a;e.u=now();mark('en:'+date+'|'+k+'|'+id);render()}
function del(k,id){if(!confirm('Ye entry hatani hai?'))return;const e=dd(date)[k].find(x=>x.id===id);if(!e)return;e.del=true;e.u=now();mark('en:'+date+'|'+k+'|'+id);render()}
// Udhaar khata: per customer, everything given on credit minus everything received back, up to this day.
function ledger(d){const B={};const base=s=>nkey(s).replace(/\s*\([\d+.\s]*\)$/,'');
 for(const x of keys()){if(x>d)break;const D=norm(S.days[x]);live(D,'ud').forEach(r=>{const k=base(r.n);B[k]=(B[k]||0)+n(r.a)});live(D,'rc').forEach(r=>{const k=base(r.n);B[k]=(B[k]||0)-n(r.a)})}
 return Object.entries(B).filter(([,v])=>Math.round(v)!==0).sort((a,b)=>b[1]-a[1])}

 return `<div class="card"><details ${OPEN.led?'open':''} ontoggle="OPEN.led=this.open"><summary><span>Udhaar khata (kis se kitna lena hai)</span><b style="margin-left:auto;padding-right:8px">${f(T)}</b></summary>
 ${L.length?L.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b class="${v<0?'pos':''}">${f(v)}</b></div>`).join(''):'<p class="hint" style="margin-top:8px">Abhi kisi ka udhaar baqi nahi.</p>'}

 const b=t.diff==null?'':Math.round(t.diff)===0?'<div class="badge ok">✓ Galla poora hai</div>':t.diff<0?`<div class="badge bad">Rs ${f(-t.diff)} kam hain</div>`:`<div class="badge more">Rs ${f(t.diff)} zyada hain</div>`;
 const R=(l,v,c)=>`<div class="sum${c?' '+c:''}"><span>${l}</span><b>${f(v)}</b></div>`;

 ${R('− Kharcha + salary (1)',t.ex+t.sl)}${R('− Ghar aur gari (2)',t.cr)}${R('− Udhaar diya (3)',t.ud)}${R('− Bill ki raqam (4)',t.bl)}${R('− Supplier (5)',t.sp)}${t.bout?R('− Bank mein jama',t.bout):''}

const r2=v=>Math.round(v*100)/100;
const mrow=(d,id)=>(S.mk.d[d]||{})[id]||{};
const mannOf=kg=>Math.floor(kg/40+1e-9);
// Always "mun - kg" like the sheet: "25 mun 10 kg", "0 mun 30 kg", "3 mun 0 kg" (never "24 mun 40 kg").
function fmk(kg){kg=r2(kg);const a=Math.abs(kg),m=mannOf(a),k=r2(a-m*40);
 return (kg<0?'−':'')+m.toLocaleString('en-PK')+' mun '+k.toLocaleString('en-PK')+' kg'}
// A party's milk for the day, like the sheet's TOTAL MILK: bandhi + cow + taken from mandi - sold to mandi.
function mtot(d,id){const r=mrow(d,id);return n(r.bm)+n(r.be)+n(r.cm)+n(r.ce)+n(r.lm)+n(r.le)-n(r.sm)-n(r.se)-n(r.gm)-n(r.ge)}
const mside=(d,k)=>S.mk.ps.filter(p=>p.kind===k).reduce((a,p)=>a+mtot(d,p.id),0);
const RATE0='2000-01-01';

function prate(id,d){const R=S.mk.pr[id]||{},k=Object.keys(R).filter(x=>x<=d).sort().pop();return k?{...R[k],from:k}:null}
const mpays=(d,id)=>(S.mk.pay[d]||[]).filter(e=>!e.del&&e.p===id);
// Hisaab (cashbook) entries whose name the owner linked to a party count as that party's payment,
// e.g. Johar (the shop) paying the owner for milk out of the galla. The "(375+375)" part of a name is ignored.
const hkBase=s=>nkey(s).replace(/\s*\([\d+.\s]*\)$/,'');
// A link like "@bl" takes a whole Hisaab section (e.g. every "Bill ki raqam / owner ko" entry); other links match one name.
function hkPays(d,id){const p=S.mk.ps.find(x=>x.id===id),hk=p&&p.hk||[];if(!hk.length||!S.days[d])return [];const D=day(d);
 const sec=hk.filter(x=>x[0]==='@').map(x=>x.slice(1)),H=hk.filter(x=>x[0]!=='@').map(hkBase);
 return KINDS.flatMap(k=>live(D,k).filter(e=>sec.includes(k)||H.includes(hkBase(e.n))).map(e=>({...e,k})))}
const hkLabel=x=>x[0]==='@'?`"${SECS[x.slice(1)][0]}" ki har entry`:x;
// A party's amount for the day, like the sheet: bandhi + cow + taken from mandi - sold to mandi,
// mandi milk at that slot's mandi rate less the party's commission.
// A day's own commission `k` (like the sheet's COMM, added to the mandi rate) replaces the party's rate commission
// for all of that day's mandi milk, taken and sold.
// Cow milk sold to the mandi has its own commission: the day's own cow commission `kc`, else the party's cow rate `g`,
// else the same as buffalo sold.
function mamt(d,id){const r=mrow(d,id),R=prate(id,d)||{},M=S.mk.mr[d]||{},dk=has(r.k),l=dk?-n(r.k):n(R.l),s=dk?-n(r.k):n(R.s),mm=n(M.m),me=n(M.e);
 const g=has(r.kc)?-n(r.kc):has(R.g)?n(R.g):s;
 const x={bk:n(r.bm)+n(r.be),ck:n(r.cm)+n(r.ce),lk:n(r.lm)+n(r.le),sk:n(r.sm)+n(r.se),gk:n(r.gm)+n(r.ge)};
 x.b=x.bk/40*n(R.b);x.c=x.ck/40*n(R.c);
 x.l=n(r.lm)/40*(mm-l)+n(r.le)/40*(me-l);x.s=n(r.sm)/40*(mm-s)+n(r.se)/40*(me-s);x.g=n(r.gm)/40*(mm-g)+n(r.ge)/40*(me-g);
 x.t=x.b+x.c+x.l-x.s-x.g;x.hp=hkPays(d,id).reduce((a,e)=>a+n(e.a),0);x.p=mpays(d,id).reduce((a,e)=>a+n(e.a),0)+x.hp;
 x.noRate=(x.bk&&!n(R.b))||(x.ck&&!n(R.c));x.noMandi=((n(r.lm)||n(r.sm)||n(r.gm))&&!mm)||((n(r.le)||n(r.se)||n(r.ge))&&!me);return x}
// Baqaya at the end of day d: opening baqaya + each later day's (amount - payments).
function mbal(id,d){const O=S.mk.ob[id]||{},from=O.d||'';let v=n(O.v);
 for(const x of mdays(id))if(x>from&&x<=d){const a=mamt(x,id);v+=a.t-a.p}return v}

 return `<div class="card"><div class="ih"><b>${esc(p.name)}</b><span class="tag">${p.kind==='sup'?'Yahan se doodh aata hai':'Yahan doodh jata hai'}</span></div>

function rcIn(rid,i,k,v){const r=S.pr.rc[rid],x=r.ins[i];if(k==='t'){r.ins[i]=v==='it'?{t:'it',id:act()[0].id,q:x.q,b:x.b}:{t:'raw',name:'',unit:'kg',q:x.q,b:x.b,c:0}}
 else if(k==='b'){x.b=n(v);x.q=x.b/rcY(r)}else x[k]=k==='c'?n(v):k==='name'?nkey(v):v;rcSave(r)}

 <p class="hint" style="margin-top:8px">Is ke liye kitna dala:</p>

function prd(){const L=rcList(),P=S.pr.d[date]||{},raw={};

 const RW=Object.entries(raw);
 if(RW.length)h+=`<div class="card"><h3>Aaj doosra saman kitna laga</h3>${RW.map(([k,v])=>{const [nm,u]=k.split('|');return `<div class="sum"><span>${esc(nm)}</span><b>${fq(v)} ${esc(u)}</b></div>`}).join('')}<p class="hint" style="margin-top:6px">Ye saman ka hisaab hai. Is ki kharidari Hisaab ke Kharcha mein likhte rahein.</p></div>`;

// ---- Employees (owner only): monthly salary, what was paid through Hisaab "Salary", and what is still due.
let emM=null,emOpen=null;
const addMon=(m,k)=>{let [y,mo]=m.split('-').map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+String(mo).padStart(2,'0')};
const monLbl=m=>MONTHS[+m.slice(5)-1]+' '+m.slice(0,4);
function salAt(e,m){const k=Object.keys(e.sal||{}).filter(x=>x<=m).sort().pop();return k?n(e.sal[k]):0}
function emPaid(e,m){const K=nkey(e.name),L=[];for(const d of keys()){if(d.slice(0,7)!==m)continue;live(day(d),'sl').forEach(x=>{if(nkey(baseN(x.n))===K)L.push({d,a:n(x.a)})})}return L}
// Baqaya carried into month m = every earlier month's salary minus what was paid, from the starting month.
function emState(e,m){const st=e.start||m;if(m<st)return null;let carry=0;for(let x=st;x<m;x=addMon(x,1))carry+=salAt(e,x)-emPaid(e,x).reduce((a,p)=>a+p.a,0);
 const P=emPaid(e,m),paid=P.reduce((a,p)=>a+p.a,0),sal=salAt(e,m);return {sal,carry,P,paid,due:carry+sal-paid}}
function emp(){emM=emM||date.slice(0,7);const E=S.em.filter(e=>!e.off),st=E.map(e=>[e,emState(e,emM)]).filter(x=>x[1]);
 const T=st.reduce((a,[,s])=>{a.sal+=s.sal;a.paid+=s.paid;a.due+=s.due;return a},{sal:0,paid:0,due:0});
 const K=new Set(S.em.map(e=>nkey(e.name))),unk={};keys().filter(d=>d.slice(0,7)===emM).forEach(d=>live(day(d),'sl').forEach(x=>{const b=nkey(baseN(x.n));if(!K.has(b))unk[b]=(unk[b]||0)+n(x.a)}));
 let h=`<button class="link" onclick="go('acct')">← Account par wapas</button>
 <div class="card"><div class="dbar" style="background:var(--soft);margin:0"><button style="color:var(--ink)" onclick="emM=addMon(emM,-1);render()" aria-label="Pichla mahina">‹</button><div class="dmid"><b>${monLbl(emM)}</b><small style="color:var(--mut)">Salary ka mahina</small></div><button style="color:var(--ink)" onclick="emM=addMon(emM,1);render()" aria-label="Agla mahina">›</button></div>
 ${st.length?`<div class="sum" style="margin-top:10px"><span>Kul salary</span><b>${f(T.sal)}</b></div><div class="sum"><span>Is mahine diya</span><b>${f(T.paid)}</b></div><div class="sum tot"><span>Mahine ke aakhir par dena hai</span><b>${f(T.due)}</b></div>`:''}</div>`;
 h+=st.map(([e,s])=>`<div class="card"><div class="ih"><b>${esc(e.name)}</b><span class="tag">Salary ${f(s.sal)}</span></div>
  ${s.carry?`<div class="sum"><span>Pichle mahinon ka ${s.carry>0?'baqaya':'advance'}</span><b class="${s.carry<0?'pos':''}">${f(s.carry)}</b></div>`:''}
  <div class="sum"><span>+ Is mahine ki salary</span><b>${f(s.sal)}</b></div>
  ${s.P.map(p=>`<div class="sum"><span class="muted">− Diya ${pk(p.d)}</span><b>${f(p.a)}</b></div>`).join('')||'<p class="hint">Is mahine abhi kuch nahi diya.</p>'}
  <div class="sum tot"><span>${s.due>=0?'Dena hai':'Advance diya hua'}</span><b class="${s.due<0?'pos':s.due>0?'neg':''}">${f(Math.abs(s.due))}</b></div>
  <details ${emOpen===e.id?'open':''} ontoggle="if(this.open)emOpen='${e.id}'"><summary>Detail badlein</summary><div style="margin-top:10px">
  <div class="fld"><label>Naam (Hisaab mein isi naam se salary likhein)</label><input type="text" value="${esc(e.name)}" onchange="emUp('${e.id}','name',this.value)"></div>
  <div class="fld"><label>Mahine ki salary (${monLbl(emM)} se)</label><input type="number" inputmode="decimal" value="${s.sal||''}" onchange="emSal('${e.id}',this.value)"></div>
  <div class="fld"><label>Kis mahine se kaam par</label><input type="month" value="${e.start||''}" onchange="emUp('${e.id}','start',this.value)"></div>
  <div class="fld"><label>Phone</label><input type="text" inputmode="tel" value="${esc(e.phone||'')}" onchange="emUp('${e.id}','phone',this.value)"></div>
  <button class="btn danger" onclick="emOff('${e.id}')">Employee hatayein</button></div></details></div>`).join('');
 const U=Object.entries(unk);
 if(U.length)h+=`<div class="card"><h3>Salary mein ye naam kisi employee ke nahi</h3>${U.map(([nm,a])=>`<div class="row"><span>${esc(nm)}<br><span class="hint">${monLbl(emM)} mein ${f(a)}</span></span><button class="btn ghost" onclick="emAdd(this.dataset.n)" data-n="${esc(nm)}">Employee banayein</button></div>`).join('')}</div>`;
 h+=`<div class="card"><h3>Naya employee</h3><div class="fld" style="margin-top:10px"><label for="enm">Naam</label><input type="text" id="enm"></div>
 <div class="g3" style="grid-template-columns:1fr 1fr"><div class="fld"><label for="esl">Mahine ki salary</label><input type="number" inputmode="decimal" id="esl"></div><div class="fld"><label for="est">Kis mahine se</label><input type="month" id="est" value="${emM}"></div></div>
 <button class="btn full" onclick="emAdd()">+ Employee add karein</button>
 <p class="hint" style="margin-top:8px">Roz Hisaab ke "Salary" hisse mein employee ka naam likh kar jo raqam denge, wo yahan us ki salary mein se kat jayegi.</p></div>`;
 const off=S.em.filter(e=>e.off);if(off.length)h+=`<div class="card"><h3>Hataye gaye</h3>${off.map(e=>`<div class="row"><span>${esc(e.name)}</span><button class="btn ghost" onclick="emUp('${e.id}','off',false)">Wapas</button></div>`).join('')}</div>`;
 return h}

// Quick buttons: what this customer usually takes, then milk, then what customers take most.

 const p={id:nid(),day:date,c:id,a,m:$('#pm').value,note:$('#pn').value.trim(),del:false,u:now()};S.dl.py.push(p);mark('dp:'+p.id);render()}
function delPay(pid){if(!confirm('Ye wasooli hatani hai?'))return;const p=S.dl.py.find(x=>x.id===pid);p.del=true;p.u=now();mark('dp:'+pid);render()}
// The bill that goes to the customer (WhatsApp and print) is in English; the app screens stay in Roman Urdu.
function billText(id){const c=cst(id),ym=bm||ymOf(date),m=cmon(id,ym),B=S.dl.bp,L=[`*${B.shop||'Gujjar Dairies'}*`];
 const who=[B.owner,B.phone].filter(Boolean).join(' · ');if(who)L.push(who);if(B.addr)L.push(B.addr);L.push('','Bill: '+monName(ym),c.name);if(c.addr)L.push(c.addr);L.push('');
 if(m.days.length){L.push('Daily details:');m.days.forEach(([d,p,a,nt])=>L.push(`${pk(d).slice(0,5)}: ${p.length?p.join(', ')+' = ':''}${a?'Rs '+f(a):''}${nt?` (Remarks: ${nt})`:''}`));L.push('')}
 m.items.forEach(x=>L.push(`${iname(x.i)}: ${fq(x.q)} × ${fq(x.r)} = Rs ${f(x.a)}`));
 L.push(`Total for ${monName(ym)}: Rs ${f(m.amt)}`);if(m.prev)L.push(`Previous balance: Rs ${f(m.prev)}`);
 m.pays.forEach(p=>L.push(`Payment received ${pk(p.day)}: Rs ${f(p.a)}`));L.push(`*Total due: Rs ${f(m.due)}*`);
 if(B.offers.length){L.push('','*Offers:*');B.offers.forEach(o=>L.push('• '+o.t))}
 L.push('','Thank you!');if(B.web)L.push(B.web);return L.join('\n')}
// Pakistani number "0300 1234567" -> "923001234567" for wa.me. No number opens WhatsApp to pick the contact.
const waNum=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='92'+d.slice(1);else if(d.length===10&&d[0]==='3')d='92'+d;return d};
function sendWA(id){const c=cst(id),ym=bm||ymOf(date);window.open(`https://wa.me/${waNum(c.phone)}?text=${encodeURIComponent(billText(id))}`,'_blank');
 (S.dl.sent[ym]=S.dl.sent[ym]||{})[id]=1;save();render()}
function nextBill(){const ym=bm||ymOf(date),sent=S.dl.sent[ym]||{},x=custs().find(c=>c.id!==bc&&!sent[c.id]&&Math.round(cmon(c.id,ym).due)>0);
 if(!x){alert('Sab customers ko is mahine ka bill bhej diya ✓');return}bc=x.id;render();scrollTo(0,0)}

 return `<div class="ph"><img src="/img/logo.png" alt=""><div><h1>${esc(B.shop||'Gujjar Dairies')}</h1>${B.owner?`<p>${esc(B.owner)}</p>`:''}${B.phone?`<p>Phone / WhatsApp: ${esc(B.phone)}</p>`:''}${B.addr?`<p>${esc(B.addr)}</p>`:''}${B.web?`<p>${esc(B.web)}</p>`:''}</div></div>
 <div class="pb"><div><h2>${esc(c.name)}</h2>${c.addr?`<p>${esc(c.addr)}</p>`:''}</div><div style="text-align:right"><b>Bill: ${monName(ym)}</b>${c.phone?`<p>${esc(c.phone)}</p>`:''}</div></div>
 <table><tr><th>Date</th><th class="l">Item</th>${rm?'<th class="l">Remarks</th>':''}<th>Amount (Rs)</th></tr>${m.days.map(([d,pa,a,nt])=>`<tr><td>${pk(d)}</td><td class="l">${pa.length?esc(pa.join(', ')):a?'Milk / items (as per register)':''}</td>${rm?`<td class="l">${esc(nt||'')}</td>`:''}<td>${a?f(a):''}</td></tr>`).join('')}
 ${m.items.map(x=>R(`${esc(iname(x.i))}: ${fq(x.q)} × ${fq(x.r)}`,f(x.a))).join('')}${R('<b>Total for '+monName(ym)+'</b>','<b>'+f(m.amt)+'</b>')}${R('Previous balance',f(m.prev))}
 ${m.pays.map(x=>R('Payment received '+pk(x.day),'−'+f(x.a))).join('')}${R('<b>Total due</b>','<b>Rs '+f(m.due)+'</b>')}</table>
 ${B.offers.length?`<div class="pof"><h2 style="margin-top:16px">Offers for you</h2><div class="po">${B.offers.map(o=>`<div>${o.img?`<img src="${o.img}" alt="">`:''}<p>${esc(o.t)}</p></div>`).join('')}</div></div>`:''}

// Printing (or "Save as PDF") shows only this bill. Waits for the logo and offer pictures so they are not blank.

// Value of stock left at the end of a day: closing (or opening if no closing yet) × cost on that day.
function stockVal(d){return act().reduce((a,it)=>{const s=day(d).st[it.id],q=s&&has(s.cl)?n(s.cl):opening(it,d);return a+Math.max(0,q)*costOf(it,d)},0)}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthRows(m){return keys().filter(d=>d.startsWith(m)&&active(S.days[d])).map(d=>{const x=tot(d);return {d,sale:x.sale+x.dsale,ex:x.ex+x.sl,pl:x.pl,sp:x.sp,ud:x.ud,diff:x.diff}})}
function monthV(){const m=date.slice(0,7),R=monthRows(m),S2=k=>R.reduce((a,r)=>a+(r[k]||0),0),[y,mo]=m.split('-');
 return `<div class="card"><h3>${MONTHS[+mo-1]} ${y} ka hisaab</h3><div style="margin-top:6px"></div>
 <div class="sum"><span>Din jin ka hisaab hai</span><b>${R.length}</b></div><div class="sum"><span>Kul sale</span><b>${f(S2('sale'))}</b></div>
 <div class="sum"><span>Kharcha + salary</span><b>${f(S2('ex'))}</b></div><div class="sum"><span>Supplier payments</span><b>${f(S2('sp'))}</b></div>
 <div class="sum"><span>Udhaar diya</span><b>${f(S2('ud'))}</b></div><div class="sum tot"><span>Asal munafa</span><b class="${S2('pl')<0?'neg':'pos'}">${f(S2('pl'))}</b></div>
 <div class="btns" style="margin-top:12px"><button class="btn ghost" onclick="monthCsv()">Excel (CSV) download</button><button class="btn ghost" onclick="shareMonth()">WhatsApp par bhejein</button></div></div>`}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
// CSV opens in Excel; the BOM keeps Excel from mangling the text.
function monthCsv(){const m=date.slice(0,7),R=monthRows(m),q=v=>`"${String(v).replace(/"/g,'""')}"`;
 const lines=[['Tareekh','Sale','Kharcha + salary','Supplier','Udhaar diya','Munafa','Galla farq'].map(q).join(',')].concat(R.map(r=>[pk(r.d),Math.round(r.sale),Math.round(r.ex),Math.round(r.sp),Math.round(r.ud),Math.round(r.pl),r.diff==null?'':Math.round(r.diff)].join(',')));
 dl(`hisaab-${m}.csv`,'﻿'+lines.join('\r\n'),'text/csv')}
const wa=t=>open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
function shareDay(){const t=tot(date);wa(`*Gujjar Dairies — ${dayName(date)} ${pk(date)}*\nSale: Rs ${f(t.sale+t.dsale)}\nKharcha + salary: Rs ${f(t.ex+t.sl)}\nSupplier: Rs ${f(t.sp)}\nUdhaar diya: Rs ${f(t.ud)}\nMunafa: Rs ${f(t.pl)}\nGalla farq: ${t.diff==null?'—':'Rs '+f(t.diff)}`)}
function shareMonth(){const m=date.slice(0,7),R=monthRows(m),S2=k=>R.reduce((a,r)=>a+(r[k]||0),0),[y,mo]=m.split('-');
 wa(`*Gujjar Dairies — ${MONTHS[+mo-1]} ${y}*\n${R.length} din\nKul sale: Rs ${f(S2('sale'))}\nKharcha + salary: Rs ${f(S2('ex'))}\nSupplier: Rs ${f(S2('sp'))}\nUdhaar diya: Rs ${f(S2('ud'))}\nMunafa: Rs ${f(S2('pl'))}`)}
function report(){const t=tot(date),T=(l,v,c)=>`<div class="tile"><span>${l}</span><b class="${c||''}">${v}</b></div>`;
 const days=keys().filter(d=>active(S.days[d])).reverse().slice(0,14);
 return `<h2>${dayName(date)}, ${pk(date)}</h2><div class="tiles">${T('Counter sale',f(t.sale))}${T('Delivery sale',f(t.dsale))}${T('Items ka munafa',f(t.prof))}${T('Delivery wasooli (cash)',f(t.dcash))}${T('Kharcha + salary',f(t.ex+t.sl))}${T('Asal munafa',f(t.pl),t.pl<0?'neg':'pos')}${T('Udhaar diya',f(t.ud))}${T('Galla farq',t.diff==null?'—':f(t.diff),t.diff<0?'neg':'')}${T('Stock ki raqam (closing × cost)',f(stockVal(date)))}</div>
 <div class="btns" style="margin:12px 0"><button class="btn" onclick="shareDay()">WhatsApp par bhejein</button></div>
 ${monthV()}
 <h2>Pichle din</h2><div class="card">${days.length?`<table><tr><th>Tareekh</th><th>Sale</th><th>Kharcha</th><th>Munafa</th></tr>${days.map(d=>{const x=tot(d);return `<tr onclick="date='${d}';render();scrollTo(0,0)"><td>${pk(d).slice(0,5)}</td><td>${f(x.sale+x.dsale)}</td><td>${f(x.ex+x.sl)}</td><td class="${x.pl<0?'neg':'pos'}">${f(x.pl)}</td></tr>`}).join('')}</table>`:'<p class="hint">Abhi koi din ka hisaab nahi.</p>'}</div>
 <p class="hint">Munafa = bike maal ka (rate − cost) minus kharcha aur salary. Ghar aur gari kharcha, udhaar, owner ko di raqam aur supplier payment munafa mein nahi ginte.</p>`}

// Items

 return `<button class="link" onclick="go('acct')">← Account par wapas</button><div class="card"><h3>Naya item</h3><div class="addr"><input type="text" id="ni" placeholder="Item ka naam" aria-label="Item ka naam"><input type="number" inputmode="decimal" id="nr" placeholder="Rate" aria-label="Rate"><button class="btn" onclick="addI()">+ Item add karein</button></div></div>
 <h2>Items, rate aur cost</h2>${act().map(it=>`<div class="card item"><div class="ih"><input type="text" class="nm" value="${esc(it.name)}" onchange="upN('${it.id}',this.value)" aria-label="Item ka naam"><button class="x" aria-label="${esc(it.name)} hatayen" onclick="offI('${it.id}',true)">✕</button></div>
 <div class="g4"><div class="f"><label>Rate</label><input type="number" inputmode="decimal" value="${it.rate}" onchange="upI('${it.id}','rate',this.value)"></div>
 <div class="f"><label>Delivery</label><input type="number" inputmode="decimal" value="${it.drate??''}" placeholder="${fq(it.rate)}" onchange="upI('${it.id}','drate',this.value)" aria-label="${esc(it.name)}: delivery rate"></div>
 <div class="f"><label>Cost</label><input type="number" inputmode="decimal" value="${it.cost}" onchange="upI('${it.id}','cost',this.value)"></div>
 <div class="f"><label>Shuru stock</label><input type="number" inputmode="decimal" value="${it.op}" onchange="upI('${it.id}','op',this.value)"></div></div></div>`).join('')}

function upI(id,k,v){const it=itm(id);it[k]=k==='drate'&&v===''?null:n(v);if(k==='op')it.u=now();else it.pru=now();mark('it:'+id);mark('pr:'+id);head()}
function upN(id,v){v=v.trim();if(!v)return;const it=itm(id);it.name=v;it.u=now();mark('it:'+id)}
function addI(){const nm=$('#ni').value.trim();if(!nm){alert('Item ka naam likhein.');return}const id='i'+Date.now(),ord=S.items.reduce((m,x)=>Math.max(m,x.ord??0),0)+1;
 S.items.push({id,name:nm,rate:n($('#nr').value),cost:0,op:0,off:false,ord,u:now(),pru:now()});mark('it:'+id);mark('pr:'+id);render()}
// Items are never deleted, only hidden, so old days keep their hisaab.
function offI(id,v){if(v&&!confirm('Ye item list se hata dein? Purana hisaab waisa hi rahega aur neeche se wapas laa sakte hain.'))return;const it=itm(id);it.off=v;it.u=now();mark('it:'+id);render()}

// ---- Login screens
let mode='in',lastEmail='',recovering=false;
function gate(inner){return `<div class="gate"><div class="art"><img class="mascot" src="/img/mascot.png" alt=""><img class="word" src="/img/logo.png" alt=""><img class="tagline" src="/img/tagline.png" alt="Khalis hi Gujjar ki pehchan hai"></div><h1 class="sr">Gujjar Dairies Hisaab</h1>${inner}</div>`}
function setMsg(t,kind){const m=$('#amsg');if(!m)return;m.hidden=!t;m.textContent=t||'';m.className='msg'+(kind?' '+kind:'')}
function loginV(){const up=mode==='up',fg=mode==='forgot';
 return gate(`<form class="card" onsubmit="event.preventDefault();submitAuth()"><h3 style="margin-bottom:14px">${up?'Naya account banayein':fg?'Password bhool gaye?':'Login karein'}</h3>
 <div class="fld"><label for="em">Email</label><input type="email" id="em" autocomplete="username" value="${esc(lastEmail)}" required></div>
 ${fg?'<p class="hint" style="margin:-4px 0 14px">Apni email likhein. Us par naya password banane ka link aayega.</p>':`<div class="fld"><label for="pw">Password</label><div class="pw"><input type="password" id="pw" autocomplete="${up?'new-password':'current-password'}" required minlength="6"><button type="button" onclick="tgPw(this)">Dikhayein</button></div></div>`}
 <button class="btn full" id="go">${up?'Account banayein':fg?'Link bhejein':'Login'}</button>
 <div id="amsg" class="msg" hidden></div>
 <div style="display:flex;justify-content:space-between;margin-top:6px">${mode!=='in'?`<button type="button" class="link" onclick="setMode('in')">← Login par wapas</button>`:`<button type="button" class="link" onclick="setMode('forgot')">Password bhool gaye?</button><button type="button" class="link" onclick="setMode('up')">Naya account</button>`}</div></form>
 ${up?'<p class="hint" style="text-align:center">Naya account staff ke liye hai. Account banne ke baad owner ki manzoori chahiye hogi.</p>':''}`)}
function tgPw(b){const i=$('#pw');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Dikhayein':'Chhupayein'}
function setMode(m){lastEmail=($('#em')||{}).value||lastEmail;mode=m;render()}
function recoverV(){return gate(`<form class="card" onsubmit="event.preventDefault();setPw('np')"><h3 style="margin-bottom:14px">Naya password banayein</h3>
 <div class="fld"><label for="np">Naya password (kam az kam 6 harf)</label><input type="password" id="np" autocomplete="new-password" required minlength="6"></div>
 <button class="btn full">Password save karein</button><div id="amsg" class="msg" hidden></div></form>`)}
function pendingV(){return gate(`<div class="card"><h3>Manzoori ka intezar</h3><p>Aap ka account <b>${esc(S.me.email)}</b> ban gaya hai. Owner apni app mein <b>Account → Staff</b> mein aap ke saamne "Staff banayein" dabaye, phir yahan neeche wala button dabayein.</p>
 <button class="btn full" onclick="sync().then(render)">Dobara check karein</button><button class="btn danger full" style="margin-top:10px" onclick="logout()">Logout</button></div>`)}
function trErr(m){return /invalid login/i.test(m)?'Email ya password ghalat hai.':/already registered|already exists/i.test(m)?'Ye email pehle se bana hua hai. Login karein.':/not confirmed/i.test(m)?'Pehle email par aaya link khol kar account pakka karein.':/should be different|same password/i.test(m)?'Naya password purane se alag rakhein.':/rate limit|security purposes|too many/i.test(m)?'Bohat koshishen ho gayin. Thori der baad dobara karein.':/invalid.*email|email.*invalid/i.test(m)?'Email sahi likhein.':/password/i.test(m)?'Password kam az kam 6 harf ka rakhein.':/fetch|network/i.test(m)?'Internet ka masla hai. Dobara koshish karein.':'Masla: '+m}
async function submitAuth(){const up=mode==='up',fg=mode==='forgot',b=$('#go');sbInit();lastEmail=$('#em').value.trim();
 if(!sb||!navigator.onLine){setMsg('Login ke liye internet chahiye.','err');return}
 if(!lastEmail){setMsg('Email likhein.','err');return}
 b.disabled=true;setMsg('Intezar karein…');
 try{
  if(fg){const {error}=await sb.auth.resetPasswordForEmail(lastEmail,{redirectTo:location.origin});
   setMsg(error?trErr(error.message):'Email bhej di. Email mein aaya link kholein, phir naya password banayein.',error?'err':'ok');return}
  const p=$('#pw').value;if(p.length<6){setMsg('Password kam az kam 6 harf ka rakhein.','err');return}
  const {data,error}=up?await sb.auth.signUp({email:lastEmail,password:p}):await sb.auth.signInWithPassword({email:lastEmail,password:p});
  if(error){setMsg(trErr(error.message),'err');return}
  if(!data.session){setMsg('Email par aaya link khol kar account pakka karein, phir yahan Login karein.','ok');return}
  who=data.session.user.email;setMsg('Data aa raha hai…');await sync();
  if(!S.me){setMsg('Login ho gaya lekin data nahi aa saka. '+trErr(syncErr||'network'),'err');return}
  tab='stock';mode='in';render()}
 finally{if(b.isConnected)b.disabled=false}}
async function setPw(id){const i=$('#'+id),p=i.value;if(p.length<6){setMsg('Password kam az kam 6 harf ka rakhein.','err');return}
 sbInit();if(!sb||!navigator.onLine){setMsg('Internet chahiye.','err');return}
 setMsg('Intezar karein…');const {error}=await sb.auth.updateUser({password:p});
 if(error){setMsg(trErr(error.message),'err');return}
 i.value='';if(recovering){recovering=false;await sync();render()}else setMsg('✓ Password badal gaya.','ok')}
async function logout(){if(!confirm('Logout karna hai? Is phone ka hisaab phone mein hi rahega.'))return;
 if(sb)await sb.auth.signOut({scope:'local'}).catch(()=>{});
 who=null;S.me=null;save();mode='in';render()}

// ---- Online sync (Supabase). Everything is saved on the phone first, then sent when internet is available.
let sb=null,who=null,busy=false,syncErr='',lastSync=null,kickT=null,MEM=null,syncP=null;
const PK={items:'id',prices:'item_id',settings:'key',day_stock:'day,item_id',entries:'id',cash:'day',milk_parties:'id',milk_rates:'day',milk_days:'day,party_id',milk_party_rates:'party_id,from_day',milk_pay:'id',milk_day_info:'day',bank_accounts:'id',bank_tx:'id',costs:'item_id,day'};
const OWNER_ONLY={it:1,pr:1,set:1,mp:1,mpr:1,mob:1,ba:1,bt:1,cs:1};
const OWNER_TABLES={prices:1,settings:1,milk_party_rates:1,bank_accounts:1,bank_tx:1,costs:1};
// Home delivery tables. The delivery man only reads item names and customers and writes deliveries.
Object.assign(PK,{customers:'id',deliveries:'day,cust_id,item_id',dpay:'id'});Object.assign(OWNER_ONLY,{dc:1,dp:1,bp:1});OWNER_TABLES.dpay=1;
// Production: recipes are written by the owner only; owner and staff write what was made.
Object.assign(PK,{recipes:'id',production:'day,recipe_id'});OWNER_ONLY.rp=1;
Object.assign(PK,{employees:'id'});OWNER_ONLY.em=1;OWNER_TABLES.employees=1;
const DLV_TABLES={items:1,customers:1,deliveries:1};
const canPush=t=>role()==='delivery'?t==='dv':own()||!OWNER_ONLY[t];
const canPull=tb=>role()==='delivery'?!!DLV_TABLES[tb]:own()||!OWNER_TABLES[tb];
function sbInit(){if(sb||!window.supabase)return;
 sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 sb.auth.onAuthStateChange((ev,s)=>{who=s&&s.user?s.user.email:null;setTimeout(()=>{
  if(ev==='PASSWORD_RECOVERY'){recovering=true;render();return}
  if(ev==='SIGNED_OUT'){if(S.me){S.me=null;save();render()}return}
  if(who)sync()},0)})}
function kick(){clearTimeout(kickT);kickT=setTimeout(sync,3000)}
function status(){const e=$('#sy');if(!e)return;const c=Object.keys(S.q).length,warn=!navigator.onLine||!!syncErr;
 e.className='pill'+(warn?' warn':'');
 e.textContent=busy?'Sync ho raha hai…':!navigator.onLine?`Offline${c?' · '+c+' baqi':''}`:syncErr?'⚠ Sync nahi hua':c?`${c} baqi`:'✓ Online'}
function toRow(t,r){
 if(t==='it'||t==='pr'){const it=itm(r);if(!it)return null;
  return t==='it'?['items',{id:it.id,name:it.name,op:n(it.op),off:!!it.off,ord:it.ord??null,u:it.u}]:['prices',{item_id:it.id,rate:n(it.rate),cost:n(it.cost),drate:num(it.drate),u:it.pru}]}
 if(t==='dc'){const c=S.dl.cs.find(x=>x.id===r);return c?['customers',{id:c.id,name:c.name,addr:c.addr||null,phone:c.phone||null,op:n(c.op),ord:c.ord??null,off:!!c.off,u:c.u}]:null}
 if(t==='dp'){const p=S.dl.py.find(x=>x.id===r);return p?['dpay',{id:p.id,day:p.day,cust_id:p.c,amount:n(p.a),mode:p.m,note:p.note||null,deleted:!!p.del,u:p.u}]:null}
 if(t==='dv'){const [d,c,i]=r.split('|'),e=((S.dl.d[d]||{})[c]||{})[i];if(!e)return null;
  return['deliveries',{day:d,cust_id:c,item_id:i,qty:num(e.q),rate:num(e.r),amount:num(e.a),note:e.n||null,deleted:!!e.del,u:e.u}]}
 if(t==='bp'){const B=S.dl.bp;return['settings',{key:'bill',value:{shop:B.shop,owner:B.owner,phone:B.phone,addr:B.addr,web:B.web,offers:B.offers},u:B.u}]}

 if(t==='rp'){const x=S.pr.rc[r];return x?['recipes',{id:x.id,item_id:x.out,ins:x.ins,y:x.y??null,off:!!x.off,u:x.u}]:null}
 if(t==='pd'){const [d,rid]=r.split('|'),x=(S.pr.d[d]||{})[rid];return x?['production',{day:d,recipe_id:rid,qty:num(x.q),u:x.u}]:null}
 if(t==='ba'){const a=S.bk.ac.find(x=>x.id===r);return a?['bank_accounts',{id:a.id,name:a.name,op:n(a.op),off:!!a.off,u:a.u}]:null}
 if(t==='bt'){const x=S.bk.tx.find(y=>y.id===r);return x?['bank_tx',{id:x.id,day:x.day,account_id:x.ac,type:x.type,party:x.party||null,amount:n(x.a),chq_no:x.no||null,chq_date:x.cd||null,status:x.st,note:x.note||null,deleted:!!x.del,u:x.u}]:null}

 if(t==='mpy'){const [d,id]=r.split('|'),e=(S.mk.pay[d]||[]).find(x=>x.id===id);return e?['milk_pay',{id:e.id,day:d,party_id:e.p,amount:n(e.a),note:e.n||'',deleted:!!e.del,u:e.u}]:null}

async function push(){const snap={...S.q},R=Object.fromEntries(Object.keys(PK).map(t=>[t,[]]));
 for(const k in snap){const i=k.indexOf(':'),t=k.slice(0,i);if(!canPush(t))continue;const row=toRow(t,k.slice(i+1));if(row)R[row[0]].push(row[1])}
 for(const [tb,rows] of Object.entries(R))for(let i=0;i<rows.length;i+=500){const {error}=await sb.from(tb).upsert(rows.slice(i,i+500),{onConflict:PK[tb]});if(error)throw error}
 for(const k in snap)if(S.q[k]===snap[k])delete S.q[k];save()}
function merge(tb,r){
 if(tb==='items'){const it=itm(r.id),o={name:r.name,op:n(r.op),off:r.off,ord:r.ord??undefined,u:r.u};if(!it){S.items.push(Object.assign({id:r.id,rate:0,cost:0,pru:0},o));return true}
  if(r.u>it.u){Object.assign(it,o);return true}return false}
 if(tb==='employees'){const i=S.em.findIndex(x=>x.id===r.id),o={id:r.id,name:r.name,phone:r.phone||'',start:r.start||'',sal:r.sal||{},off:r.off,u:r.u};
  if(i<0){S.em.push(o);return true}if(r.u>S.em[i].u){S.em[i]=o;return true}return false}
 if(tb==='recipes'){const x=S.pr.rc[r.id];if(x&&r.u<=(x.u||0))return false;S.pr.rc[r.id]={id:r.id,out:r.item_id,ins:r.ins||[],y:r.y??undefined,off:r.off,u:r.u};return true}
 if(tb==='production'){const P=S.pr.d[r.day]=S.pr.d[r.day]||{},x=P[r.recipe_id];if(x&&r.u<=(x.u||0))return false;P[r.recipe_id]={q:r.qty??'',u:r.u};return true}
 if(tb==='costs'){const C=S.cs[r.item_id]=S.cs[r.item_id]||{},c=C[r.day];if(c&&r.u<=(c.u||0))return false;C[r.day]={c:r.cost??'',u:r.u};return true}
 if(tb==='bank_accounts'){const a=S.bk.ac.find(x=>x.id===r.id),o={name:r.name,op:n(r.op),off:r.off,u:r.u};if(!a){S.bk.ac.push(Object.assign({id:r.id},o));return true}
  if(r.u>a.u){Object.assign(a,o);return true}return false}
 if(tb==='bank_tx'){const i=S.bk.tx.findIndex(x=>x.id===r.id),o={id:r.id,day:r.day,ac:r.account_id,type:r.type,party:r.party||'',a:n(r.amount),no:r.chq_no||'',cd:r.chq_date||'',st:r.status,note:r.note||'',del:r.deleted,u:r.u};
  if(i<0){S.bk.tx.push(o);return true}if(r.u>S.bk.tx[i].u){S.bk.tx[i]=o;return true}return false}
 if(tb==='prices'){const it=itm(r.item_id);if(it&&r.u>it.pru){Object.assign(it,{rate:n(r.rate),cost:n(r.cost),drate:r.drate??null,pru:r.u});return true}return false}
 if(tb==='customers'){const c=S.dl.cs.find(x=>x.id===r.id),o={name:r.name,addr:r.addr||'',phone:r.phone||'',op:n(r.op),ord:r.ord??undefined,off:r.off,u:r.u};
  if(!c){S.dl.cs.push(Object.assign({id:r.id},o));return true}if(r.u>c.u){Object.assign(c,o);return true}return false}
 if(tb==='dpay'){const i=S.dl.py.findIndex(x=>x.id===r.id),o={id:r.id,day:r.day,c:r.cust_id,a:n(r.amount),m:r.mode,note:r.note||'',del:r.deleted,u:r.u};
  if(i<0){S.dl.py.push(o);return true}if(r.u>S.dl.py[i].u){S.dl.py[i]=o;return true}return false}
 if(tb==='deliveries'){const C=(S.dl.d[r.day]=S.dl.d[r.day]||{}),L=(C[r.cust_id]=C[r.cust_id]||{}),x=L[r.item_id];
  // The server fills in the rate after an upload, so a same-time row with a rate is still taken.
  if(x&&(r.u<x.u||(r.u===x.u&&(!has(r.rate)||has(x.r)))))return false;
  L[r.item_id]={q:r.qty??'',r:r.rate??'',a:r.amount??'',n:r.note||'',del:r.deleted,u:r.u};return true}
 if(tb==='settings'){if(r.key==='cash0'&&r.u>S.c0u){S.cash0=n(r.value);S.c0u=r.u;return true}
  if(r.key==='bill'){if(r.u>(S.dl.bp.u||0)){S.dl.bp=Object.assign({shop:'',owner:'',phone:'',addr:'',web:'',offers:[]},r.value||{},{u:r.u});return true}return false}
  if(r.key.startsWith('mob:')){const id=r.key.slice(4),O=S.mk.ob[id],v=r.value||{};if(!O||r.u>(O.u||0)){S.mk.ob[id]={v:n(v.v),d:v.d||'',u:r.u};return true}}return false}
 if(tb==='milk_party_rates'){const P=S.mk.pr[r.party_id]=S.mk.pr[r.party_id]||{},x=P[r.from_day];if(x&&r.u<=(x.u||0))return false;
  P[r.from_day]={b:r.br??'',c:r.cr??'',l:r.ladj??'',s:r.sadj??'',g:r.gadj??'',u:r.u};return true}
 if(tb==='milk_day_info'){const X=S.mk.x[r.day];if(X&&r.u<=(X.u||0))return false;S.mk.x[r.day]={sz:r.suzuki??'',w:r.why||'',n:r.note||'',u:r.u};return true}
 if(tb==='milk_pay'){const L=S.mk.pay[r.day]=S.mk.pay[r.day]||[],i=L.findIndex(x=>x.id===r.id),e={id:r.id,p:r.party_id,a:n(r.amount),n:r.note||'',del:r.deleted,u:r.u};
  if(i<0){L.push(e);return true}if(r.u>L[i].u){L[i]=e;return true}return false}
 if(tb==='milk_parties'){const p=S.mk.ps.find(x=>x.id===r.id);if(!p){S.mk.ps.push({id:r.id,name:r.name,kind:r.kind,off:r.off,hk:r.hk||[],u:r.u});return true}
  if(r.u>p.u){Object.assign(p,{name:r.name,kind:r.kind,off:r.off,hk:r.hk||[],u:r.u});return true}return false}
 if(tb==='milk_rates'){const R=S.mk.mr[r.day];if(!R||r.u>(R.u||0)){S.mk.mr[r.day]={m:r.mor??'',e:r.eve??'',u:r.u};return true}return false}
 if(tb==='milk_days'){const P=S.mk.d[r.day]=S.mk.d[r.day]||{},x=P[r.party_id];if(x&&r.u<=(x.u||0))return false;
  const o={k:r.k??'',kc:r.kc??'',u:r.u};MF.forEach(k=>o[k]=r[k]??'');P[r.party_id]=o;return true}
 const D=dd(r.day);
 if(tb==='day_stock'){const s=D.st[r.item_id];if(!s||r.u>(s.u||0)){D.st[r.item_id]={pu:r.pu??'',us:r.us??'',cl:r.cl??'',rt:r.rt??'',u:r.u};return true}return false}
 if(tb==='entries'){const L=D[r.kind]||(D[r.kind]=[]),i=L.findIndex(x=>x.id===r.id),e={id:r.id,n:r.name,a:n(r.amount),del:r.deleted,u:r.u};
  if(i<0){L.push(e);return true}if(r.u>L[i].u){L[i]=e;return true}return false}
 if(tb==='cash'){if(r.u>(D.cu||0)){D.cash=r.amount==null?null:n(r.amount);D.cu=r.u;return true}return false}return false}
async function pull(){let ch=false;
 for(const tb of Object.keys(PK)){if(!canPull(tb))continue;
  // Re-read the last minute too, so rows committed slightly out of order are not missed. Merging is idempotent.
  const since=new Date(new Date(S.cur[tb]||0).getTime()-60000).toISOString();let max=S.cur[tb]||null;
  for(let off=0;;off+=1000){const {data,error}=await sb.from(tb).select('*').gt('sa',since).order('sa').range(off,off+999);if(error)throw error;
   data.forEach(r=>{if(merge(tb,r))ch=true;if(!max||r.sa>max)max=r.sa});if(data.length<1000)break}
  if(max)S.cur[tb]=max}
 save();return ch}
function sync(){return syncP||(syncP=doSync().finally(()=>{syncP=null}))}
async function doSync(){sbInit();if(!sb||!navigator.onLine){status();return}
 const {data:{session},error:se}=await sb.auth.getSession();who=session?session.user.email:null;
 if(!session){if(!se&&S.me){S.me=null;save();render()}status();return}
 busy=true;status();let redraw=false;
 try{const {data:m,error}=await sb.from('members').select('role').eq('user_id',session.user.id).maybeSingle();if(error)throw error;
  const r=m?m.role:'pending';if(!S.me||S.me.role!==r||S.me.email!==who)redraw=true;S.me={email:who,role:r};save();
  if(r==='owner'&&!S.seeded){const {count,error:ce}=await sb.from('items').select('id',{count:'exact',head:true});if(ce)throw ce;
   if(!count)S.items.forEach(it=>{S.q['it:'+it.id]=S.q['it:'+it.id]||1;S.q['pr:'+it.id]=S.q['pr:'+it.id]||1});S.seeded=true;save()}
  if(r!=='pending'){await push();if(await pull())redraw=true}
  lastSync=new Date();syncErr=''}
 catch(e){syncErr=e.message||String(e)}
 finally{busy=false}
 const a=document.activeElement;if(redraw&&!(a&&a.tagName==='INPUT'))render();else status()}
