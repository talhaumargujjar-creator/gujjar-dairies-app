<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}

.pw{position:relative}
.pw input{padding-right:96px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--bink);font-size:15px;font-weight:600;padding:10px}
.msg{padding:11px 13px;border-radius:12px;background:var(--ambbg);color:var(--amb);margin-top:12px;font-size:15px}
.msg.err{background:var(--redbg);color:var(--red)}
.msg.ok{background:var(--grnbg);color:var(--grn)}
.av{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--bink);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.role{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--grnbg);color:var(--grn)}
.nm{font-weight:700;border-color:transparent!important;background:transparent!important;padding-left:4px!important}
.nm:focus{border-color:var(--bink)!important;background:var(--field)!important}
.stat b.sm{font-size:15px;white-space:normal;line-height:1.2}
.mg{display:grid;grid-template-columns:62px 1fr 1fr;gap:6px 8px;align-items:center;margin-top:4px}
.mg .h{font-size:14px;font-weight:700;text-align:center}
.mg .rl{font-size:14px;font-weight:600;line-height:1.15}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mk input{min-height:46px;padding:6px 2px;text-align:center;font-size:16px}
.mk.u i{font-style:normal;font-size:12px;color:var(--mut);text-align:center}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"›";transform:rotate(90deg);color:var(--mut)}
details[open] summary::after{transform:rotate(-90deg)}
</style>

const SECS={ex:['Kharche',['LABOUR KHARCHI','SAFAYI','ROTI','CHEENI','GAS CYLINDER','RIKSHA KIRAYA','BIKE PETROL','LABOUR CHAI','WATER','SALARY']],
 cr:['Customer / doodh wale ko payment',['DELIVERY','HOME EXP. + PARCEL']],
 sp:['Supplier ko payment',['BRADY\'S BILL','DAWN BILL','EGG BILL','CUP CAKE','PLAIN CAKE','BISCUIT WALA']],
 rc:['Cash wasool (delivery, udhaar)',['DELIVERY','HAJI WASOOL']]};
const KINDS=['ex','cr','sp','rc'];

const n=v=>parseFloat(v)||0, has=v=>v!=null&&v!=='', num=v=>has(v)?n(v):null;

// v1 data (or an imported backup) -> v2: every record gets an edit time `u` and is queued for upload.
function migrate(o,t){const q={};
 o.items.forEach(it=>{it.off=!!it.off;it.u=t;it.pru=t;q['it:'+it.id]=1;q['pr:'+it.id]=1});
 for(const [d,D] of Object.entries(o.days)){D.st=D.st||{};
  for(const [id,s] of Object.entries(D.st)){s.u=t;if(has(s.pu)||has(s.us)||has(s.cl))q['st:'+d+'|'+id]=1}
  for(const k of KINDS)D[k]=(D[k]||[]).map(r=>{const e={id:r.id||nid(),n:r.n,a:n(r.a),del:!!r.del,u:t};q['en:'+d+'|'+k+'|'+e.id]=1;return e});
  if(D.cash===undefined)D.cash=null;D.cu=t;if(D.cash!=null)q['ca:'+d]=1}
 o.c0u=t;q['set:cash0']=1;
 if(o.mk){o.mk.ps.forEach(p=>{p.u=t;q['mp:'+p.id]=1});
  for(const [d,R] of Object.entries(o.mk.mr)){R.u=t;q['mr:'+d]=1}
  for(const [d,P] of Object.entries(o.mk.d))for(const [id,r] of Object.entries(P)){r.u=t;q['md:'+d+'|'+id]=1}}
 return Object.assign(o,{v:2,q,cur:o.cur||{},me:o.me||null})}
function load(){let s=null,o=null;
 try{s=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(s&&s.v===2)return s;
 try{o=JSON.parse(localStorage.getItem(K1))}catch(e){}
 if(o&&o.items&&o.days)return migrate(o,1);
 return{v:2,items:SEED.map((r,i)=>({id:'i'+i,name:r[0],rate:r[1],cost:r[2],op:r[3],off:false,u:0,pru:0})),days:{},cash0:0,c0u:0,q:{},cur:{},me:null}}
// Doodh book (replaces the MILK 2026 sheet). Quantities are kg; 1 mann = 40 kg.
// mk = {ps:[{id,name,kind:'sup'|'buy',off,u}], mr:{day:{m,e,u}} mandi rate per mann, d:{day:{partyId:{bm,be,cm,ce,lm,le,sm,se,u}}}}
// b = bandhi, c = cow, l = taken from mandi, s = sold to mandi; m = morning, e = evening.
const MK_SEED=[['p_wasif','Wasif Chacho','sup'],['p_bikri','Bikri Bara','sup'],['p_johar','Johar','buy']];
const MF=['bm','be','cm','ce','lm','le','sm','se'];
function mkInit(s){if(s.mk)return;s.mk={ps:MK_SEED.map(([id,name,kind])=>({id,name,kind,off:false,u:1})),mr:{},d:{}};MK_SEED.forEach(r=>s.q['mp:'+r[0]]=s.q['mp:'+r[0]]||1)}
let S=load(),MEMO={};mkInit(S);
const save=()=>{MEMO={};try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Save nahi hua. Phone ki storage check karein aur Backup lein.')}};
save();
const mark=k=>{S.q[k]=now();save();kick()};
const tz=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDay=(d,k)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+k);return x.toISOString().slice(0,10)};
const DAYS=['Itwaar','Peer','Mangal','Budh','Jumeraat','Juma','Hafta'];
const dayName=d=>DAYS[new Date(d+'T00:00:00Z').getUTCDay()];
const pk=d=>d.split('-').reverse().join('-');
let date=tz(),tab='stock',q='',flt='all';
const role=()=>S.me?S.me.role:'owner', own=()=>role()==='owner';
const EMPTY={st:{},ex:[],cr:[],sp:[],rc:[],cash:null,cu:0};
const day=d=>S.days[d]||EMPTY;
const dd=d=>S.days[d]=S.days[d]||{st:{},ex:[],cr:[],sp:[],rc:[],cash:null,cu:0};
const live=(D,k)=>D[k].filter(r=>!r.del);
const keys=()=>MEMO.k||(MEMO.k=Object.keys(S.days).sort());
const before=d=>keys().filter(x=>x<d).reverse();
const active=D=>D.cash!=null||KINDS.some(k=>live(D,k).length)||Object.values(D.st).some(s=>has(s.cl));
function opening(it,d){for(const x of before(d)){const s=S.days[x].st[it.id];if(s&&has(s.cl))return n(s.cl)}return n(it.op)}
// Sold = opening + purchase - used in shop - closing. Without a closing the item is not counted.
function sold(it,d){const s=day(d).st[it.id];if(!s||!has(s.cl))return 0;return q2(opening(it,d)+n(s.pu)-n(s.us)-n(s.cl))}
// Opening galla = previous working day's counted cash, or what it should have been if not counted.
function gOpen(d){for(const x of before(d)){const D=S.days[x];if(!active(D))continue;return D.cash!=null?n(D.cash):tot(x).exp}return n(S.cash0)}
function tot(d){if(MEMO['t'+d])return MEMO['t'+d];const D=day(d);let sale=0,prof=0;
 S.items.forEach(it=>{const s=sold(it,d);sale+=s*n(it.rate);prof+=s*(n(it.rate)-n(it.cost))});
 const sm=k=>live(D,k).reduce((a,b)=>a+n(b.a),0),ex=sm('ex'),cr=sm('cr'),sp=sm('sp'),rc=sm('rc'),op=gOpen(d);
 const exp=op+sale+rc-ex-cr-sp;return MEMO['t'+d]={sale,prof,ex,cr,sp,rc,op,exp,pl:prof-ex,diff:D.cash!=null?n(D.cash)-exp:null,cash:D.cash}}

function navV(){return `<nav class="tabs">${tabs().map(([k,l])=>`<button aria-current="${tab==k}" onclick="go('${k}')"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg></i>${l}</button>`).join('')}</nav>`}
function go(t){tab=t;render();scrollTo(0,0);if(t==='acct')loadMembers()}
function statsV(){if(tab==='doodh')return mstatsV();const t=tot(date);return `<div class="stat"><span>Sale</span><b>${f(t.sale)}</b></div><div class="stat"><span>Munafa</span><b class="y">${f(t.pl)}</b></div><div class="stat"><span>Galla farq</span><b>${t.diff==null?'—':f(t.diff)}</b></div>`}
function hdr(){return `<header class="hdr"><div class="top"><div class="brand"><img src="/img/logo.png" alt="Gujjar Dairies"><small><b>${own()?'Owner':'Staff'}</b><br>Hisaab</small></div><button class="pill" id="sy" onclick="go('acct')"></button></div>
 <div class="dbar"><button onclick="shift(-1)" aria-label="Pichla din">‹</button><div class="dmid"><input type="date" id="dt" value="${date}" onchange="setDate(this.value)" aria-label="Tareekh"><small>${dayName(date)}${date===tz()?' · Aaj':''}</small></div><button onclick="shift(1)" aria-label="Agla din">›</button></div>
 ${own()||tab==='doodh'?`<div class="stats" id="stats">${statsV()}</div>`:''}</header>`}
function head(){const e=$('#stats');if(e)e.innerHTML=statsV();status()}
function shift(k){date=addDay(date,k);render()}
function setDate(v){date=v||tz();render()}
function render(){const a=$('#app');
 if(recovering){a.innerHTML=recoverV();return}
 if(!S.me||!S.me.email){a.innerHTML=loginV();return}
 if(S.me.role==='pending'){a.innerHTML=pendingV();return}
 if(!tabs().some(t=>t[0]===tab))tab='stock';
 a.innerHTML=hdr()+`<main>${({stock,hisaab,doodh,report,items,acct})[tab]()}</main>`+navV();status()}

// Stock
const isDone=it=>has((day(date).st[it.id]||{}).cl);
function line(it){const s=day(date).st[it.id]||{},tin=opening(it,date)+n(s.pu);
 if(!has(s.cl))return `<span>Total ${fq(tin)}</span><span>Closing likhni hai</span>`;
 const sd=sold(it,date);if(sd<0)return `<span class="neg">Closing total se zyada hai. Dobara check karein.</span>`;
 return `<span>Total ${fq(tin)} · Bika <b>${fq(sd)}</b></span>`+(own()?`<span><b>Rs ${f(sd*n(it.rate))}</b></span>`:'')}
function card(it){const s=day(date).st[it.id]||{};
 const inp=(k,l)=>`<div class="f"><label for="${k}${it.id}">${l}</label><input type="number" inputmode="decimal" enterkeyhint="next" id="${k}${it.id}" value="${s[k]??''}" onchange="setS('${it.id}','${k}',this)"></div>`;
 return `<div class="card item${isDone(it)?' done':''}"><div class="ih"><b>${esc(it.name)}</b>${own()?`<span class="tag">Rate ${fq(it.rate)}</span>`:''}</div>
 <div class="g4"><div class="f"><span class="l">Opening</span><div class="v">${fq(opening(it,date))}</div></div>${inp('pu','Purchase')}${inp('us','Istemal')}${inp('cl','Closing')}</div>
 <div class="res">${line(it)}</div></div>`}
const act=()=>S.items.filter(i=>!i.off);
function listV(){const L=act().filter(i=>i.name.toLowerCase().includes(q.toLowerCase())&&(flt==='all'||(flt==='done')===isDone(i)));
 return L.map(card).join('')||`<p class="hint" style="text-align:center;padding:20px">${flt==='left'?'Sab items ho gaye ✓':'Koi item nahi mila.'}</p>`}
function progV(){const A=act(),d=A.filter(isDone).length;return {d,t:A.length,p:A.length?d*100/A.length:0}}
function stock(){const p=progV();
 return `<div class="card"><div class="sh"><h3>Stock ki ginti</h3><span class="muted" id="pc">${p.d} / ${p.t} items</span></div><div class="prog"><i id="pb" style="width:${p.p}%"></i></div>
 <p class="hint" style="margin-top:10px">Har item ki <b>Purchase</b> aur <b>Closing</b> likhein. <b>Istemal</b> sirf tab likhein jab maal bika nahi balke dukaan mein kaam aaya (jaise doodh se dahi).</p></div>
 <input type="search" placeholder="Item dhoondein" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=listV()" aria-label="Item dhoondein">
 <div class="chips">${[['all','Sab'],['left','Baqi'],['done','Ho gaye']].map(([k,l])=>`<button class="chip" aria-pressed="${flt===k}" onclick="flt='${k}';render()">${l}</button>`).join('')}</div>
 <div id="list">${listV()}</div>`}
// Updates only this card so the keyboard stays on the next field.
function setS(id,k,el){const D=dd(date),s=D.st[id]=D.st[id]||{pu:'',us:'',cl:'',u:0};s[k]=el.value;s.u=now();mark('st:'+date+'|'+id);head();
 const c=el.closest('.card');c.querySelector('.res').innerHTML=line(itm(id));c.classList.toggle('done',has(s.cl));
 const p=progV(),pc=$('#pc'),pb=$('#pb');if(pc)pc.textContent=p.d+' / '+p.t+' items';if(pb)pb.style.width=p.p+'%'}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.type!=='number')return;
 const L=[...document.querySelectorAll('#list input[type=number],#mg input[type=number]')],i=L.indexOf(e.target);if(i>=0&&L[i+1]){e.preventDefault();L[i+1].focus()}});

// Hisaab
function sec(k){const D=day(date),[title,names]=SECS[k],L=live(D,k),tt=L.reduce((a,b)=>a+n(b.a),0);
 return `<div class="card"><div class="sh"><h3>${title}</h3><b>${f(tt)}</b></div>
 ${L.length?`<div style="margin-top:8px">${L.map(r=>`<div class="row"><span>${esc(r.n)}</span><span>${f(n(r.a))}<button class="x" aria-label="${esc(r.n)} hatayen" onclick="del('${k}','${r.id}')">✕</button></span></div>`).join('')}</div>`:''}
 <div class="qc">${names.map(x=>`<button onclick="pick('${k}',this.textContent)">${esc(x)}</button>`).join('')}</div>
 <div class="addr"><input type="text" id="n${k}" placeholder="Naam" aria-label="${title}: naam"><input type="number" inputmode="decimal" id="a${k}" placeholder="Raqam" aria-label="${title}: raqam"><button class="btn" onclick="addL('${k}')">+ Add karein</button></div></div>`}
function pick(k,v){$('#n'+k).value=v;$('#a'+k).focus()}
function addL(k){const nm=$('#n'+k).value.trim(),a=n($('#a'+k).value);if(!nm||!a){alert('Naam aur raqam dono likhein.');return}
 const e={id:nid(),n:nm,a,del:false,u:now()};dd(date)[k].push(e);mark('en:'+date+'|'+k+'|'+e.id);render()}
function del(k,id){if(!confirm('Ye entry hatani hai?'))return;const e=dd(date)[k].find(x=>x.id===id);if(!e)return;e.del=true;e.u=now();mark('en:'+date+'|'+k+'|'+id);render()}
function galla(){const t=tot(date),ci=`<div class="fld" style="margin:12px 0 0"><label for="ch">Galle mein asal cash (gin kar likhein)</label><input type="number" inputmode="decimal" id="ch" value="${t.cash??''}" onchange="setC(this.value)"></div>`;
 if(!own())return `<div class="card"><h3>Galla</h3>${ci}</div>`;
 const b=t.diff==null?'':Math.round(t.diff)===0?'<div class="badge ok">✓ Galla poora hai</div>':t.diff<0?`<div class="badge bad">Rs ${f(-t.diff)} kam hain</div>`:`<div class="badge more">Rs ${f(t.diff)} zyada hain</div>`;
 return `<div class="card"><h3>Galla</h3>
 <div class="sum" style="margin-top:6px"><span>Pichla bacha galla</span><b>${f(t.op)}</b></div>
 <div class="sum"><span>+ Sale</span><b>${f(t.sale)}</b></div>
 <div class="sum"><span>+ Wasool</span><b>${f(t.rc)}</b></div>
 <div class="sum"><span>− Kharche aur payments</span><b>${f(t.ex+t.cr+t.sp)}</b></div>
 <div class="sum tot"><span>Galle mein hona chahiye</span><b>${f(t.exp)}</b></div>${ci}${b}</div>`}
function hisaab(){return KINDS.map(sec).join('')+galla()}
function setC(v){const D=dd(date);D.cash=v===''?null:n(v);D.cu=now();mark('ca:'+date);render()}

// Doodh
const r2=v=>Math.round(v*100)/100;
const mrow=(d,id)=>(S.mk.d[d]||{})[id]||{};
const mannOf=kg=>Math.floor(kg/40+1e-9);
// "25 mann 10 kg", always normalised (never "24 mann 40 kg").
function fmk(kg){kg=r2(kg);const a=Math.abs(kg),m=mannOf(a),k=r2(a-m*40);
 return (kg<0?'−':'')+(m?m.toLocaleString('en-PK')+' mann':'')+(k||!m?(m?' ':'')+k.toLocaleString('en-PK')+' kg':'')}
// A party's milk for the day, like the sheet's TOTAL MILK: bandhi + cow + taken from mandi - sold to mandi.
function mtot(d,id){const r=mrow(d,id);return n(r.bm)+n(r.be)+n(r.cm)+n(r.ce)+n(r.lm)+n(r.le)-n(r.sm)-n(r.se)}
const mside=(d,k)=>S.mk.ps.filter(p=>p.kind===k).reduce((a,p)=>a+mtot(d,p.id),0);
function mstatsV(){const a=mside(date,'sup'),g=mside(date,'buy'),df=r2(a-g);
 return `<div class="stat"><span>Aaya</span><b class="sm">${fmk(a)}</b></div><div class="stat"><span>Gaya</span><b class="sm">${fmk(g)}</b></div><div class="stat"><span>Farq</span><b class="sm${df?' y':''}">${fmk(df)}</b></div>`}
const MROWS=[['b','Bandhi'],['c','Cow'],['l','Mandi se liya'],['s','Mandi ko becha']];
let mp=null,pOpen=false;
const mps=()=>S.mk.ps.filter(p=>!p.off);
function mcard(p){const r=mrow(date,p.id);
 const cell=(k,l)=>{const v=r[k],m=has(v)?mannOf(n(v)):'',g=has(v)?r2(n(v)-m*40):'';
  return `<div class="mk"><input type="number" inputmode="decimal" enterkeyhint="next" value="${m}" aria-label="${l} mann" onchange="setM('${p.id}','${k}',this)"><input type="number" inputmode="decimal" enterkeyhint="next" value="${g}" aria-label="${l} kg" onchange="setM('${p.id}','${k}',this)"></div>`};
 return `<div class="card"><div class="ih"><b>${esc(p.name)}</b><span class="tag">${p.kind==='sup'?'Yahan se doodh aata hai':'Yahan doodh jata hai'}</span></div>
 <div class="mg" id="mg"><span></span><span class="h">Subah</span><span class="h">Shaam</span><span></span><span class="mk u"><i>mann</i><i>kg</i></span><span class="mk u"><i>mann</i><i>kg</i></span>
 ${MROWS.map(([k,l])=>`<span class="rl">${l}</span>${cell(k+'m',l+' subah')}${cell(k+'e',l+' shaam')}`).join('')}</div>
 <div class="res"><span>Aaj ka kul doodh</span><b id="mpt">${fmk(mtot(date,p.id))}</b></div></div>`}
// Updates only the totals so the keyboard stays on the next field.
function setM(id,k,el){const w=el.parentNode.querySelectorAll('input'),a=w[0].value,b=w[1].value,v=a===''&&b===''?'':r2(n(a)*40+n(b));
 if(v!==''&&v<0){alert('Minus mat likhein. Mandi ko doodh becha ho to "Mandi ko becha" wali line mein likhein.');render();return}
 const D=S.mk.d[date]=S.mk.d[date]||{},r=D[id]=D[id]||{u:0};r[k]=v;r.u=now();mark('md:'+date+'|'+id);
 const t=$('#mpt');if(t)t.textContent=fmk(mtot(date,id));const s=$('#msum');if(s)s.innerHTML=msumIn();head()}
function setMR(k,v){const R=S.mk.mr[date]=S.mk.mr[date]||{m:'',e:'',u:0};R[k]=v===''?'':n(v);R.u=now();mark('mr:'+date)}
function msumIn(){const a=mside(date,'sup'),g=mside(date,'buy'),df=r2(a-g);
 const L=k=>S.mk.ps.filter(p=>p.kind===k&&(!p.off||mtot(date,p.id))).map(p=>`<div class="sum"><span>${esc(p.name)}</span><b>${fmk(mtot(date,p.id))}</b></div>`).join('');
 return `<h3>Aaj ka milan</h3><p class="hint" style="margin-top:6px">Jahan se doodh aaya</p>${L('sup')}<div class="sum tot"><span>Kul aaya</span><b>${fmk(a)}</b></div>
 <p class="hint" style="margin-top:12px">Jahan doodh gaya</p>${L('buy')}<div class="sum tot"><span>Kul gaya</span><b>${fmk(g)}</b></div>
 ${!a&&!g?'':!df?'<div class="badge ok">✓ Doodh barabar hai</div>':df>0?`<div class="badge more">${fmk(df)} doodh kam gaya</div>`:`<div class="badge bad">${fmk(-df)} doodh zyada gaya</div>`}`}
function partiesV(){return `<div class="card"><details ${pOpen?'open':''} ontoggle="pOpen=this.open"><summary>Parties</summary>
 ${S.mk.ps.map(p=>`<div class="row"><span style="flex:1;min-width:0"><input type="text" class="nm" value="${esc(p.name)}" onchange="upP('${p.id}',this.value)" aria-label="Party ka naam"><span class="hint" style="padding-left:4px">${p.kind==='sup'?'Doodh dene wali':'Doodh lene wali'}${p.off?' · hatai hui':''}</span></span>${p.off?`<button class="btn ghost" onclick="offP('${p.id}',false)">Wapas</button>`:`<button class="x" aria-label="${esc(p.name)} hatayen" onclick="offP('${p.id}',true)">✕</button>`}</div>`).join('')}
 <input type="text" id="npn" placeholder="Nayi party ka naam" aria-label="Nayi party ka naam" style="margin-top:12px">
 <div class="g3" style="grid-template-columns:1fr 1fr;margin-top:8px"><button class="btn" style="font-size:15px;padding:10px 6px" onclick="addP('sup')">+ Doodh dene wali</button><button class="btn" style="font-size:15px;padding:10px 6px" onclick="addP('buy')">+ Doodh lene wali</button></div></details></div>`}
function upP(id,v){v=v.trim();if(!v)return;const p=S.mk.ps.find(x=>x.id===id);p.name=v;p.u=now();mark('mp:'+id);render()}
function offP(id,v){if(v&&!confirm('Ye party list se hata dein? Purana hisaab waisa hi rahega aur yahin se wapas laa sakte hain.'))return;const p=S.mk.ps.find(x=>x.id===id);p.off=v;p.u=now();mark('mp:'+id);render()}
function addP(k){const nm=$('#npn').value.trim();if(!nm){alert('Party ka naam likhein.');return}
 const id='p'+Date.now().toString(36);S.mk.ps.push({id,name:nm,kind:k,off:false,u:now()});mark('mp:'+id);mp=id;render()}
function doodh(){const P=mps(),R=S.mk.mr[date]||{};if(!P.some(p=>p.id===mp))mp=P.length?P[0].id:null;const p=S.mk.ps.find(x=>x.id===mp);
 const ri=(k,l)=>`<div class="f"><label for="mr${k}">${l}</label><input type="number" inputmode="decimal" id="mr${k}" value="${R[k]??''}" onchange="setMR('${k}',this.value)"></div>`;
 return `<div class="card"><h3>Mandi rate (1 mann ka)</h3><div class="g3" style="grid-template-columns:1fr 1fr;margin-top:10px">${ri('m','Subah')}${ri('e','Shaam')}</div></div>
 <div class="chips" style="flex-wrap:wrap">${P.map(x=>`<button class="chip" aria-pressed="${x.id===mp}" onclick="mp='${x.id}';render()">${esc(x.name)}</button>`).join('')}</div>
 ${p?mcard(p):'<p class="hint" style="text-align:center;padding:20px">Koi party nahi. Neeche Parties mein add karein.</p>'}
 <div class="card" id="msum">${msumIn()}</div>${own()?partiesV():''}`}

// Report
function report(){const t=tot(date),T=(l,v,c)=>`<div class="tile"><span>${l}</span><b class="${c||''}">${v}</b></div>`;
 const days=keys().filter(d=>active(S.days[d])).reverse().slice(0,14);
 return `<h2>${dayName(date)}, ${pk(date)}</h2><div class="tiles">${T('Counter sale',f(t.sale))}${T('Items ka munafa',f(t.prof))}${T('Kharche',f(t.ex))}${T('Asal munafa',f(t.pl),t.pl<0?'neg':'pos')}${T('Supplier payments',f(t.sp))}${T('Galla farq',t.diff==null?'—':f(t.diff),t.diff<0?'neg':'')}</div>
 <h2>Pichle din</h2><div class="card">${days.length?`<table><tr><th>Tareekh</th><th>Sale</th><th>Kharche</th><th>Munafa</th></tr>${days.map(d=>{const x=tot(d);return `<tr onclick="date='${d}';render();scrollTo(0,0)"><td>${pk(d).slice(0,5)}</td><td>${f(x.sale)}</td><td>${f(x.ex)}</td><td class="${x.pl<0?'neg':'pos'}">${f(x.pl)}</td></tr>`}).join('')}</table>`:'<p class="hint">Abhi koi din ka hisaab nahi.</p>'}</div>
 <p class="hint">Munafa = bike maal ka (rate − cost) minus kharche. Supplier payment stock ki kharidari hai, kharcha nahi.</p>`}

// Items
function items(){const off=S.items.filter(i=>i.off);
 return `<div class="card"><h3>Naya item</h3><div class="addr"><input type="text" id="ni" placeholder="Item ka naam" aria-label="Item ka naam"><input type="number" inputmode="decimal" id="nr" placeholder="Rate" aria-label="Rate"><button class="btn" onclick="addI()">+ Item add karein</button></div></div>
 <h2>Items, rate aur cost</h2>${act().map(it=>`<div class="card item"><div class="ih"><input type="text" class="nm" value="${esc(it.name)}" onchange="upN('${it.id}',this.value)" aria-label="Item ka naam"><button class="x" aria-label="${esc(it.name)} hatayen" onclick="offI('${it.id}',true)">✕</button></div>
 <div class="g3"><div class="f"><label>Rate</label><input type="number" inputmode="decimal" value="${it.rate}" onchange="upI('${it.id}','rate',this.value)"></div>
 <div class="f"><label>Cost</label><input type="number" inputmode="decimal" value="${it.cost}" onchange="upI('${it.id}','cost',this.value)"></div>
 <div class="f"><label>Shuru stock</label><input type="number" inputmode="decimal" value="${it.op}" onchange="upI('${it.id}','op',this.value)"></div></div></div>`).join('')}
 ${off.length?`<h2>Hataye gaye items</h2><div class="card">${off.map(it=>`<div class="row"><span>${esc(it.name)}</span><button class="btn ghost" onclick="offI('${it.id}',false)">Wapas layein</button></div>`).join('')}</div>`:''}`}
function upI(id,k,v){const it=itm(id);it[k]=n(v);if(k==='op')it.u=now();else it.pru=now();mark('it:'+id);mark('pr:'+id);head()}
function upN(id,v){v=v.trim();if(!v)return;const it=itm(id);it.name=v;it.u=now();mark('it:'+id)}
function addI(){const nm=$('#ni').value.trim();if(!nm){alert('Item ka naam likhein.');return}const id='i'+Date.now();
 S.items.push({id,name:nm,rate:n($('#nr').value),cost:0,op:0,off:false,u:now(),pru:now()});mark('it:'+id);mark('pr:'+id);render()}
// Items are never deleted, only hidden, so old days keep their hisaab.
function offI(id,v){if(v&&!confirm('Ye item list se hata dein? Purana hisaab waisa hi rahega aur neeche se wapas laa sakte hain.'))return;const it=itm(id);it.off=v;it.u=now();mark('it:'+id);render()}

// ---- Login screens
let mode='in',lastEmail='',recovering=false;
function gate(inner){return `<div class="gate"><div class="art"><img class="mascot" src="/img/mascot.png" alt=""><img class="word" src="/img/logo.png" alt=""><img class="tagline" src="/img/tagline.png" alt="Khalis hi Gujjar ki pehchan hai"></div><h1 class="sr">Gujjar Dairies Hisaab</h1>${inner}</div>`}
function setMsg(t,kind){const m=$('#amsg');if(!m)return;m.hidden=!t;m.textContent=t||'';m.className='msg'+(kind?' '+kind:'')}
function loginV(){const up=mode==='up',fg=mode==='forgot';
 return gate(`<form class="card" onsubmit="event.preventDefault();submitAuth()"><h3 style="margin-bottom:14px">${up?'Naya account banayein':fg?'Password bhool gaye?':'Login karein'}</h3>
 <div class="fld"><label for="em">Email</label><input type="email" id="em" autocomplete="username" value="${esc(lastEmail)}" required></div>
 ${fg?'<p class="hint" style="margin:-4px 0 14px">Apni email likhein. Us par naya password banane ka link aayega.</p>':`<div class="fld"><label for="pw">Password</label><div class="pw"><input type="password" id="pw" autocomplete="${up?'new-password':'current-password'}" required minlength="6"><button type="button" onclick="tgPw(this)">Dikhayein</button></div></div>`}
 <button class="btn full" id="go">${up?'Account banayein':fg?'Link bhejein':'Login'}</button>
 <div id="amsg" class="msg" hidden></div>
 <div style="display:flex;justify-content:space-between;margin-top:6px">${mode!=='in'?`<button type="button" class="link" onclick="setMode('in')">← Login par wapas</button>`:`<button type="button" class="link" onclick="setMode('forgot')">Password bhool gaye?</button><button type="button" class="link" onclick="setMode('up')">Naya account</button>`}</div></form>
 ${up?'<p class="hint" style="text-align:center">Naya account staff ke liye hai. Account banne ke baad owner ki manzoori chahiye hogi.</p>':''}`)}
function tgPw(b){const i=$('#pw');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Dikhayein':'Chhupayein'}
function setMode(m){lastEmail=($('#em')||{}).value||lastEmail;mode=m;render()}
function recoverV(){return gate(`<form class="card" onsubmit="event.preventDefault();setPw('np')"><h3 style="margin-bottom:14px">Naya password banayein</h3>
 <div class="fld"><label for="np">Naya password (kam az kam 6 harf)</label><input type="password" id="np" autocomplete="new-password" required minlength="6"></div>
 <button class="btn full">Password save karein</button><div id="amsg" class="msg" hidden></div></form>`)}
function pendingV(){return gate(`<div class="card"><h3>Manzoori ka intezar</h3><p>Aap ka account <b>${esc(S.me.email)}</b> ban gaya hai. Owner apni app mein <b>Account → Staff</b> mein aap ke saamne "Staff banayein" dabaye, phir yahan neeche wala button dabayein.</p>
 <button class="btn full" onclick="sync().then(render)">Dobara check karein</button><button class="btn danger full" style="margin-top:10px" onclick="logout()">Logout</button></div>`)}
function trErr(m){return /invalid login/i.test(m)?'Email ya password ghalat hai.':/already registered|already exists/i.test(m)?'Ye email pehle se bana hua hai. Login karein.':/not confirmed/i.test(m)?'Pehle email par aaya link khol kar account pakka karein.':/should be different|same password/i.test(m)?'Naya password purane se alag rakhein.':/rate limit|security purposes|too many/i.test(m)?'Bohat koshishen ho gayin. Thori der baad dobara karein.':/invalid.*email|email.*invalid/i.test(m)?'Email sahi likhein.':/password/i.test(m)?'Password kam az kam 6 harf ka rakhein.':/fetch|network/i.test(m)?'Internet ka masla hai. Dobara koshish karein.':'Masla: '+m}
async function submitAuth(){const up=mode==='up',fg=mode==='forgot',b=$('#go');sbInit();lastEmail=$('#em').value.trim();
 if(!sb||!navigator.onLine){setMsg('Login ke liye internet chahiye.','err');return}
 if(!lastEmail){setMsg('Email likhein.','err');return}
 b.disabled=true;setMsg('Intezar karein…');
 try{
  if(fg){const {error}=await sb.auth.resetPasswordForEmail(lastEmail,{redirectTo:location.origin});
   setMsg(error?trErr(error.message):'Email bhej di. Email mein aaya link kholein, phir naya password banayein.',error?'err':'ok');return}
  const p=$('#pw').value;if(p.length<6){setMsg('Password kam az kam 6 harf ka rakhein.','err');return}
  const {data,error}=up?await sb.auth.signUp({email:lastEmail,password:p}):await sb.auth.signInWithPassword({email:lastEmail,password:p});
  if(error){setMsg(trErr(error.message),'err');return}
  if(!data.session){setMsg('Email par aaya link khol kar account pakka karein, phir yahan Login karein.','ok');return}
  who=data.session.user.email;setMsg('Data aa raha hai…');await sync();
  if(!S.me){setMsg('Login ho gaya lekin data nahi aa saka. '+trErr(syncErr||'network'),'err');return}
  tab='stock';mode='in';render()}
 finally{if(b.isConnected)b.disabled=false}}
async function setPw(id){const i=$('#'+id),p=i.value;if(p.length<6){setMsg('Password kam az kam 6 harf ka rakhein.','err');return}
 sbInit();if(!sb||!navigator.onLine){setMsg('Internet chahiye.','err');return}
 setMsg('Intezar karein…');const {error}=await sb.auth.updateUser({password:p});
 if(error){setMsg(trErr(error.message),'err');return}
 i.value='';if(recovering){recovering=false;await sync();render()}else setMsg('✓ Password badal gaya.','ok')}
async function logout(){if(!confirm('Logout karna hai? Is phone ka hisaab phone mein hi rahega.'))return;
 if(sb)await sb.auth.signOut({scope:'local'}).catch(()=>{});
 who=null;S.me=null;save();mode='in';render()}

// ---- Online sync (Supabase). Everything is saved on the phone first, then sent when internet is available.
let sb=null,who=null,busy=false,syncErr='',lastSync=null,kickT=null,MEM=null,syncP=null;
const PK={items:'id',prices:'item_id',settings:'key',day_stock:'day,item_id',entries:'id',cash:'day',milk_parties:'id',milk_rates:'day',milk_days:'day,party_id'};
const OWNER_ONLY={it:1,pr:1,set:1,mp:1};
function sbInit(){if(sb||!window.supabase)return;
 sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 sb.auth.onAuthStateChange((ev,s)=>{who=s&&s.user?s.user.email:null;setTimeout(()=>{
  if(ev==='PASSWORD_RECOVERY'){recovering=true;render();return}
  if(ev==='SIGNED_OUT'){if(S.me){S.me=null;save();render()}return}
  if(who)sync()},0)})}
function kick(){clearTimeout(kickT);kickT=setTimeout(sync,3000)}
function status(){const e=$('#sy');if(!e)return;const c=Object.keys(S.q).length,warn=!navigator.onLine||!!syncErr;
 e.className='pill'+(warn?' warn':'');
 e.textContent=busy?'Sync ho raha hai…':!navigator.onLine?`Offline${c?' · '+c+' baqi':''}`:syncErr?'⚠ Sync nahi hua':c?`${c} baqi`:'✓ Online'}
function toRow(t,r){
 if(t==='it'||t==='pr'){const it=itm(r);if(!it)return null;
  return t==='it'?['items',{id:it.id,name:it.name,op:n(it.op),off:!!it.off,u:it.u}]:['prices',{item_id:it.id,rate:n(it.rate),cost:n(it.cost),u:it.pru}]}
 if(t==='set')return['settings',{key:'cash0',value:n(S.cash0),u:S.c0u}];
 if(t==='mp'){const p=S.mk.ps.find(x=>x.id===r);return p?['milk_parties',{id:p.id,name:p.name,kind:p.kind,off:!!p.off,u:p.u}]:null}
 if(t==='mr'){const R=S.mk.mr[r];return R?['milk_rates',{day:r,mor:num(R.m),eve:num(R.e),u:R.u}]:null}
 if(t==='md'){const [d,id]=r.split('|'),x=(S.mk.d[d]||{})[id];if(!x)return null;const o={day:d,party_id:id,u:x.u};MF.forEach(k=>o[k]=num(x[k]));return['milk_days',o]}
 const [d,a,b]=r.split('|'),D=S.days[d];if(!D)return null;
 if(t==='st'){const s=D.st[a];return s?['day_stock',{day:d,item_id:a,pu:num(s.pu),us:num(s.us),cl:num(s.cl),u:s.u||0}]:null}
 if(t==='en'){const e=(D[a]||[]).find(x=>x.id===b);return e?['entries',{id:e.id,day:d,kind:a,name:e.n,amount:n(e.a),deleted:!!e.del,u:e.u}]:null}
 if(t==='ca')return['cash',{day:d,amount:D.cash,u:D.cu||0}];return null}
async function push(){const snap={...S.q},R=Object.fromEntries(Object.keys(PK).map(t=>[t,[]]));
 for(const k in snap){const i=k.indexOf(':'),t=k.slice(0,i);if(OWNER_ONLY[t]&&!own())continue;const row=toRow(t,k.slice(i+1));if(row)R[row[0]].push(row[1])}
 for(const [tb,rows] of Object.entries(R))for(let i=0;i<rows.length;i+=500){const {error}=await sb.from(tb).upsert(rows.slice(i,i+500),{onConflict:PK[tb]});if(error)throw error}
 for(const k in snap)if(S.q[k]===snap[k])delete S.q[k];save()}
function merge(tb,r){
 if(tb==='items'){const it=itm(r.id);if(!it){S.items.push({id:r.id,name:r.name,op:n(r.op),off:r.off,rate:0,cost:0,u:r.u,pru:0});return true}
  if(r.u>it.u){Object.assign(it,{name:r.name,op:n(r.op),off:r.off,u:r.u});return true}return false}
 if(tb==='prices'){const it=itm(r.item_id);if(it&&r.u>it.pru){Object.assign(it,{rate:n(r.rate),cost:n(r.cost),pru:r.u});return true}return false}
 if(tb==='settings'){if(r.key==='cash0'&&r.u>S.c0u){S.cash0=n(r.value);S.c0u=r.u;return true}return false}
 if(tb==='milk_parties'){const p=S.mk.ps.find(x=>x.id===r.id);if(!p){S.mk.ps.push({id:r.id,name:r.name,kind:r.kind,off:r.off,u:r.u});return true}
  if(r.u>p.u){Object.assign(p,{name:r.name,kind:r.kind,off:r.off,u:r.u});return true}return false}
 if(tb==='milk_rates'){const R=S.mk.mr[r.day];if(!R||r.u>(R.u||0)){S.mk.mr[r.day]={m:r.mor??'',e:r.eve??'',u:r.u};return true}return false}
 if(tb==='milk_days'){const P=S.mk.d[r.day]=S.mk.d[r.day]||{},x=P[r.party_id];if(x&&r.u<=(x.u||0))return false;
  const o={u:r.u};MF.forEach(k=>o[k]=r[k]??'');P[r.party_id]=o;return true}
 const D=dd(r.day);
 if(tb==='day_stock'){const s=D.st[r.item_id];if(!s||r.u>(s.u||0)){D.st[r.item_id]={pu:r.pu??'',us:r.us??'',cl:r.cl??'',u:r.u};return true}return false}
 if(tb==='entries'){const L=D[r.kind],i=L.findIndex(x=>x.id===r.id),e={id:r.id,n:r.name,a:n(r.amount),del:r.deleted,u:r.u};
  if(i<0){L.push(e);return true}if(r.u>L[i].u){L[i]=e;return true}return false}
 if(tb==='cash'){if(r.u>(D.cu||0)){D.cash=r.amount==null?null:n(r.amount);D.cu=r.u;return true}return false}return false}
async function pull(){let ch=false;
 for(const tb of Object.keys(PK)){if(!own()&&(tb==='prices'||tb==='settings'))continue;
  // Re-read the last minute too, so rows committed slightly out of order are not missed. Merging is idempotent.
  const since=new Date(new Date(S.cur[tb]||0).getTime()-60000).toISOString();let max=S.cur[tb]||null;
  for(let off=0;;off+=1000){const {data,error}=await sb.from(tb).select('*').gt('sa',since).order('sa').range(off,off+999);if(error)throw error;
   data.forEach(r=>{if(merge(tb,r))ch=true;if(!max||r.sa>max)max=r.sa});if(data.length<1000)break}
  if(max)S.cur[tb]=max}
 save();return ch}
function sync(){return syncP||(syncP=doSync().finally(()=>{syncP=null}))}
async function doSync(){sbInit();if(!sb||!navigator.onLine){status();return}
 const {data:{session},error:se}=await sb.auth.getSession();who=session?session.user.email:null;
 if(!session){if(!se&&S.me){S.me=null;save();render()}status();return}
 busy=true;status();let redraw=false;
 try{const {data:m,error}=await sb.from('members').select('role').eq('user_id',session.user.id).maybeSingle();if(error)throw error;
  const r=m?m.role:'pending';if(!S.me||S.me.role!==r||S.me.email!==who)redraw=true;S.me={email:who,role:r};save();
  if(r==='owner'&&!S.seeded){const {count,error:ce}=await sb.from('items').select('id',{count:'exact',head:true});if(ce)throw ce;
   if(!count)S.items.forEach(it=>{S.q['it:'+it.id]=S.q['it:'+it.id]||1;S.q['pr:'+it.id]=S.q['pr:'+it.id]||1});S.seeded=true;save()}
  if(r!=='pending'){await push();if(await pull())redraw=true}
  lastSync=new Date();syncErr=''}
 catch(e){syncErr=e.message||String(e)}
 finally{busy=false}
 const a=document.activeElement;if(redraw&&!(a&&a.tagName==='INPUT'))render();else status()}
async function loadMembers(){if(!sb||!who||!own()||!navigator.onLine)return;
 const {data,error}=await sb.from('members').select('user_id,email,role,created_at').order('created_at');if(!error){MEM=data;if(tab==='acct')render()}}
async function setRole(id,r){const {error}=await sb.from('members').update({role:r}).eq('user_id',id);if(error)alert(trErr(error.message));loadMembers()}

// Account
function acct(){const c=Object.keys(S.q).length,r=role();
 let h=`<div class="card" style="display:flex;gap:14px;align-items:center"><div class="av">${esc((S.me.email||'?')[0].toUpperCase())}</div><div style="min-width:0"><b style="word-break:break-all">${esc(S.me.email)}</b><br><span class="role">${r==='owner'?'Owner':'Staff'}</span></div></div>
 <div class="card"><div class="sh"><h3>Online sync</h3><b class="${syncErr||!navigator.onLine?'neg':'pos'}" style="font-size:16px">${busy?'Ho raha hai…':!navigator.onLine?'Offline':syncErr?'Masla':'Theek hai'}</b></div>
 <div class="sum" style="margin-top:6px"><span>Bhejne ke liye baqi</span><b>${c}</b></div>
 <div class="sum"><span>Aakhri sync</span><b>${lastSync?lastSync.toLocaleTimeString('en-PK',{hour:'numeric',minute:'2-digit'}):'—'}</b></div>
 ${syncErr?`<p class="msg err">${esc(trErr(syncErr))}</p>`:''}
 <p class="hint" style="margin:6px 0 12px">Internet na ho tab bhi likhte rahein. Internet aate hi sab khud online chala jayega.</p>
 <button class="btn ghost full" onclick="sync().then(render)">Abhi sync karein</button></div>`;
 if(own()&&MEM){const o=MEM.filter(x=>x.role!=='owner');
  h+=`<div class="card"><h3>Staff</h3>${o.map(x=>`<div class="row"><span style="min-width:0;word-break:break-all">${esc(x.email||'')}<br><span class="hint">${x.role==='staff'?'Staff':'Manzoori baqi'}</span></span>${x.role==='staff'?`<button class="btn ghost" onclick="setRole('${x.user_id}','pending')">Rok dein</button>`:`<button class="btn" onclick="setRole('${x.user_id}','staff')">Staff banayein</button>`}</div>`).join('')||'<p class="hint" style="margin-top:8px">Abhi koi staff nahi. Staff apne phone par is app mein "Naya account" banaye, phir yahan nazar aayega.</p>'}</div>`}
 h+=`<form class="card" onsubmit="event.preventDefault();setPw('np')"><details><summary>Password badlein</summary><div class="fld" style="margin-top:12px"><label for="np">Naya password (kam az kam 6 harf)</label><input type="password" id="np" autocomplete="new-password" minlength="6"></div><button class="btn full">Password save karein</button><div id="amsg" class="msg" hidden></div></details></form>`;
 if(own())h+=`<div class="card"><details><summary>Backup</summary><p class="hint" style="margin:12px 0">Backup file apne WhatsApp ya Google Drive mein bhi save kar lein.</p><button class="btn ghost full" onclick="exp()">Backup file download karein</button>
 <p class="hint" style="margin:16px 0 8px">Purana backup wapas lane ke liye file chunein. Is phone ka data us file se badal jayega aur online bhi chala jayega.</p><input type="file" accept=".json" onchange="imp(this.files[0])" aria-label="Backup file"></details></div>
 <div class="card"><div class="fld" style="margin:0"><label for="c0">Shuru ka galla (pehle din ke liye)</label><input type="number" inputmode="decimal" id="c0" value="${S.cash0}" onchange="S.cash0=n(this.value);S.c0u=now();mark('set:cash0');head()"></div></div>`;
 return h+`<button class="btn danger full" onclick="logout()">Logout</button>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='hisaab-backup-'+tz()+'.json';a.click()}
function imp(file){if(!file)return;file.text().then(t=>{try{const d=JSON.parse(t);if(!d.items||!d.days)throw 0;
 if(confirm('Is phone ka data is file se badalna hai?')){const me=S.me,cur=S.cur,seeded=S.seeded;S=migrate(d,now());Object.assign(S,{me,cur,seeded});mkInit(S);save();render();kick()}}catch(e){alert('Ye sahi backup file nahi hai.')}})}

window.addEventListener('online',()=>{status();sync()});window.addEventListener('offline',status);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
setInterval(()=>{if(document.visibilityState==='visible')sync()},60000);
window.addEventListener('load',()=>{sbInit();sync();if(!S.me)render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();
</script>
</body>
